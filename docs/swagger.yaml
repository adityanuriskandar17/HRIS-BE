basePath: /api/v1
definitions:
  dto.CancelSubscriptionRequest:
    properties:
      reason:
        type: string
    type: object
  dto.CompanyDTO:
    properties:
      address:
        example: 123 Main St, Anytown, USA
        type: string
      createdAt:
        example: "2023-01-01T00:00:00Z"
        type: string
      currency:
        example: USD
        type: string
      id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      name:
        example: Acme Corp
        type: string
      registrationNo:
        example: "123456789"
        type: string
      tenantId:
        example: 123e4567-e89b-12d3-a456-426614174001
        type: string
      timezone:
        example: UTC
        type: string
      updatedAt:
        example: "2023-01-01T00:00:00Z"
        type: string
    type: object
  dto.CompanyLimitsDTO:
    properties:
      id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      maxDepartments:
        example: 10
        type: integer
      maxEmployees:
        example: 100
        type: integer
      maxPositions:
        example: 50
        type: integer
      name:
        example: Acme Corp
        type: string
      tenantId:
        example: 123e4567-e89b-12d3-a456-426614174001
        type: string
    type: object
  dto.CompanySettingsDTO:
    properties:
      address:
        example: 123 Main St, Anytown, USA
        type: string
      currency:
        example: USD
        type: string
      id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      name:
        example: Acme Corp
        type: string
      registrationNo:
        example: "123456789"
        type: string
      tenantId:
        example: 123e4567-e89b-12d3-a456-426614174001
        type: string
      timezone:
        example: UTC
        type: string
    type: object
  dto.CreateEmployeeAccountRequest:
    properties:
      email:
        example: employee@acmecorp.com
        type: string
      firstName:
        example: Jane
        type: string
      lastName:
        example: Smith
        type: string
      password:
        example: EmployeePass123!
        type: string
    type: object
  dto.CreateTenantRequest:
    properties:
      companyName:
        example: Acme Corp
        type: string
      domain:
        example: acme.com
        type: string
      email:
        example: john.doe@example.com
        type: string
      name:
        example: John Doe
        type: string
    required:
    - companyName
    - domain
    - email
    - name
    type: object
  dto.EmployeeRequest:
    properties:
      email:
        type: string
      employeeCode:
        type: string
      employmentStatus:
        type: string
      fullName:
        type: string
      positionId:
        type: string
      unitId:
        type: string
    type: object
  dto.InvoiceResponse:
    properties:
      amount:
        type: number
      createdAt:
        type: string
      dueDate:
        type: string
      id:
        type: string
      invoiceNumber:
        type: string
      paidAt:
        type: string
      paymentId:
        type: string
      sentAt:
        type: string
      status:
        type: string
      subscriptionId:
        type: string
      tenantId:
        type: string
      updatedAt:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        example: john.doe@example.com
        type: string
      password:
        example: SecurePass123!
        type: string
    type: object
  dto.PayInvoiceRequest:
    properties:
      paymentId:
        type: string
      paymentMethod:
        type: string
      transactionId:
        type: string
    type: object
  dto.PositionRequest:
    properties:
      companyId:
        type: string
      description:
        type: string
      level:
        type: string
      title:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      email:
        example: john.doe@example.com
        type: string
      firstName:
        example: John
        type: string
      lastName:
        example: Doe
        type: string
      password:
        example: SecurePass123!
        type: string
      tenant:
        $ref: '#/definitions/dto.TenantRegistration'
      tenantId:
        example: ""
        type: string
    type: object
  dto.RenewSubscriptionRequest:
    properties:
      billingCycle:
        type: string
      months:
        type: integer
      paymentMethod:
        type: string
    type: object
  dto.SendInvoiceRequest:
    properties:
      email:
        type: string
    type: object
  dto.SubscriptionRequest:
    properties:
      billingCycle:
        description: monthly, yearly
        type: string
      endDate:
        type: string
      paymentMethod:
        type: string
      planId:
        type: string
      startDate:
        type: string
      status:
        type: string
      tenantId:
        type: string
    type: object
  dto.SubscriptionResponse:
    properties:
      billingCycle:
        type: string
      createdAt:
        type: string
      endDate:
        type: string
      id:
        type: string
      paymentMethod:
        type: string
      planId:
        type: string
      planName:
        type: string
      startDate:
        type: string
      status:
        type: string
      tenantId:
        type: string
      updatedAt:
        type: string
    type: object
  dto.TenantDTO:
    properties:
      active:
        example: true
        type: boolean
      companyName:
        example: Acme Corp
        type: string
      createdAt:
        example: "2023-01-01T00:00:00Z"
        type: string
      domain:
        example: acme.com
        type: string
      email:
        example: john.doe@example.com
        type: string
      id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      name:
        example: John Doe
        type: string
      updatedAt:
        example: "2023-01-01T00:00:00Z"
        type: string
    type: object
  dto.TenantRegistration:
    properties:
      companyName:
        example: Acme Corporation
        type: string
      domain:
        example: acmecorp.com
        type: string
      email:
        example: admin@acmecorp.com
        type: string
      name:
        example: John Doe
        type: string
    type: object
  dto.UnitRequest:
    properties:
      code:
        type: string
      name:
        type: string
    type: object
  dto.UpdateCompanyRequest:
    properties:
      address:
        example: 456 Oak Ave, Anytown, USA
        type: string
      currency:
        example: EUR
        type: string
      name:
        example: Acme Inc
        type: string
      registrationNo:
        example: "987654321"
        type: string
      timezone:
        example: America/New_York
        type: string
    type: object
  dto.UpdateCompanySettingsRequest:
    properties:
      address:
        example: 456 Oak Ave, Anytown, USA
        type: string
      currency:
        example: EUR
        type: string
      name:
        example: Acme Inc
        type: string
      registrationNo:
        example: "987654321"
        type: string
      timezone:
        example: America/New_York
        type: string
    type: object
  dto.UpdateTenantRequest:
    properties:
      active:
        example: false
        type: boolean
      companyName:
        example: Acme Inc
        type: string
      domain:
        example: acme-inc.com
        type: string
      email:
        example: john.smith@example.com
        type: string
      name:
        example: John Smith
        type: string
    type: object
  dto.UserResponse:
    properties:
      email:
        type: string
      firstName:
        type: string
      id:
        type: string
      isActive:
        type: boolean
      lastName:
        type: string
    type: object
  handler.refreshReq:
    properties:
      refreshToken:
        type: string
    type: object
  model.Employee:
    properties:
      createdAt:
        type: string
      createdById:
        type: string
      dateOfBirth:
        type: string
      email:
        type: string
      employeeCode:
        type: string
      employmentStatus:
        $ref: '#/definitions/model.EmploymentStatus'
      endDate:
        type: string
      fullName:
        type: string
      id:
        type: string
      phone:
        type: string
      position:
        $ref: '#/definitions/model.Position'
      positionId:
        type: string
      startDate:
        type: string
      unit:
        $ref: '#/definitions/model.Unit'
      unitId:
        type: string
      updatedAt:
        type: string
      updatedById:
        type: string
    type: object
  model.EmploymentStatus:
    enum:
    - FULLTIME
    - CONTRACT
    - INTERN
    - PARTTIME
    type: string
    x-enum-varnames:
    - EmploymentFullTime
    - EmploymentContract
    - EmploymentIntern
    - EmploymentPartTime
  model.Invoice:
    properties:
      amount:
        type: number
      createdAt:
        type: string
      dueDate:
        type: string
      id:
        type: string
      invoiceNumber:
        type: string
      paidAt:
        type: string
      paymentId:
        type: string
      sentAt:
        type: string
      status:
        $ref: '#/definitions/model.InvoiceStatus'
      subscriptionId:
        type: string
      tenantId:
        type: string
      updatedAt:
        type: string
    type: object
  model.InvoiceStatus:
    enum:
    - draft
    - sent
    - paid
    - overdue
    - canceled
    type: string
    x-enum-varnames:
    - InvoiceStatusDraft
    - InvoiceStatusSent
    - InvoiceStatusPaid
    - InvoiceStatusOverdue
    - InvoiceStatusCanceled
  model.Position:
    properties:
      companyId:
        type: string
      createdAt:
        type: string
      description:
        type: string
      id:
        type: string
      level:
        type: integer
      title:
        type: string
      updatedAt:
        type: string
    type: object
  model.Unit:
    properties:
      code:
        type: string
      createdAt:
        type: string
      createdById:
        type: string
      id:
        type: string
      name:
        type: string
      updatedAt:
        type: string
      updatedById:
        type: string
    type: object
  response.Meta:
    properties:
      trace_id:
        type: string
    type: object
  response.Response:
    properties:
      data: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  response.TokenResponseEnvelope:
    properties:
      data:
        properties:
          accessToken:
            type: string
          expiresIn:
            type: integer
          refreshExpiresIn:
            type: integer
          refreshToken:
            type: string
          role:
            type: string
        type: object
      meta:
        $ref: '#/definitions/response.Meta'
      success:
        type: boolean
    type: object
host: localhost:8081
info:
  contact: {}
  description: Human Resource Information System API
  title: HRIS API
  version: "1.0"
paths:
  /auth/employee:
    post:
      consumes:
      - application/json
      description: Admin creates an employee account tied to their tenant
      parameters:
      - description: Employee account data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateEmployeeAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Create employee account
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user with email and password
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.TokenResponseEnvelope'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Login user
      tags:
      - auth
  /auth/profile:
    get:
      consumes:
      - application/json
      description: Retrieve the current authenticated user's profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get current user profile
      tags:
      - auth
  /auth/profile/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve a user's profile by ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get user profile by ID
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Refresh access token using refresh token
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.refreshReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.TokenResponseEnvelope'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Refresh access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: User registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Register a new user
      tags:
      - auth
  /companies/{id}:
    get:
      consumes:
      - application/json
      description: Get company profile by ID
      parameters:
      - description: Company ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.CompanyDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Get company profile
      tags:
      - companies
    patch:
      consumes:
      - application/json
      description: Update company profile by ID
      parameters:
      - description: Company ID
        in: path
        name: id
        required: true
        type: string
      - description: Update company request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCompanyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.CompanyDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Update company profile
      tags:
      - companies
  /companies/{id}/limits:
    get:
      consumes:
      - application/json
      description: Get company limits based on subscription plan
      parameters:
      - description: Company ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.CompanyLimitsDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Get company limits
      tags:
      - companies
  /companies/{id}/settings:
    get:
      consumes:
      - application/json
      description: Get company settings by ID
      parameters:
      - description: Company ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.CompanySettingsDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Get company settings
      tags:
      - companies
    patch:
      consumes:
      - application/json
      description: Update company settings by ID
      parameters:
      - description: Company ID
        in: path
        name: id
        required: true
        type: string
      - description: Update company settings request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCompanySettingsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.CompanySettingsDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Update company settings
      tags:
      - companies
  /invoices:
    get:
      consumes:
      - application/json
      description: Get all invoices
      parameters:
      - description: Invoice status
        in: query
        name: status
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Limit per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.InvoiceResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all invoices
      tags:
      - invoices
    post:
      consumes:
      - application/json
      description: Create a new invoice
      parameters:
      - description: Invoice data
        in: body
        name: invoice
        required: true
        schema:
          $ref: '#/definitions/model.Invoice'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.InvoiceResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new invoice
      tags:
      - invoices
  /invoices/{id}:
    get:
      consumes:
      - application/json
      description: Get invoice by ID
      parameters:
      - description: Invoice ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.InvoiceResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get invoice by ID
      tags:
      - invoices
    put:
      consumes:
      - application/json
      description: Update an invoice
      parameters:
      - description: Invoice ID
        in: path
        name: id
        required: true
        type: string
      - description: Invoice data
        in: body
        name: invoice
        required: true
        schema:
          $ref: '#/definitions/model.Invoice'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.InvoiceResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update an invoice
      tags:
      - invoices
  /invoices/{id}/pay:
    post:
      consumes:
      - application/json
      description: Pay an invoice
      parameters:
      - description: Invoice ID
        in: path
        name: id
        required: true
        type: string
      - description: Payment details
        in: body
        name: pay
        required: true
        schema:
          $ref: '#/definitions/dto.PayInvoiceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Pay an invoice
      tags:
      - invoices
  /invoices/{id}/send:
    post:
      consumes:
      - application/json
      description: Send an invoice
      parameters:
      - description: Invoice ID
        in: path
        name: id
        required: true
        type: string
      - description: Send details
        in: body
        name: send
        required: true
        schema:
          $ref: '#/definitions/dto.SendInvoiceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
